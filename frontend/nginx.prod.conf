# nginx config for the production frontend container.
# Upstream topology:
#   client -> amber2-nginx-1 (edge, port 3000) -> amber2-frontend:3000 (this file)
# The edge proxy strips HMR-specific headers; this server just serves static files.

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Immutable static assets (Vite emits hashed filenames).
    location ~* \.(?:js|mjs|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|map)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: client-side router handles unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Entry HTML must never be cached, so new deploys are seen immediately.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Health endpoint for compose healthcheck / edge probes.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
