# H4 blue/green production worker overlay.
#
# Compose together with docker-compose.yml and docker-compose.canary.yml. Each
# worker extends the already validated H4 canary worker, consumes the four live
# queues, and owns one private promotion queue for an unambiguous health probe.
# Production handover remains manual and checkpointed; see the runbook.

name: amber2

services:
  worker-h4-live-1:
    extends:
      file: docker-compose.yml
      service: worker
    image: amber2-worker:latest
    container_name: amber2-worker-h4-live-1
    command: celery -A src.workers.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2} --hostname=h4-live-1@%h -Q high_priority,celery,evaluation,low_priority,h4_promotion_1
    environment:
      PYTHONPATH: /app/.packages-h4:/app:/app/src:/app/.packages
      AMBER_H4_ML_RUNTIME_ROOT: /app/.packages-h4
      HF_HOME: /app/.packages-h4/hf-cache
      HUGGINGFACE_HUB_CACHE: /app/.packages-h4/hf-cache/hub
      AMBER_CANARY: "true"
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./config:/app/config:ro
      - ./alembic:/app/alembic:ro
      - graphrag-uploads:/app/uploads:ro
      - pip-packages:/app/.packages:ro
      - h4-ml-runtime:/app/.packages-h4:ro
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.workers.celery_app inspect ping -d 'h4-live-1@$(hostname)' -t 5 -j | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 300s

