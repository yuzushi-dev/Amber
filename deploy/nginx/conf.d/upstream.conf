# Live upstream — points to the primary API container.
# Activate with: bash deploy/cutover.sh --to live
#
# OPERATIONAL NOTE: this file is git-tracked (so a fresh checkout has a
# working default), but deploy/cutover.sh mutates it in place at runtime.
# Before any `git reset --hard`/`git checkout -- .` on a host where cutover
# may be active, capture the current target first:
#   grep -q api-canary deploy/nginx/conf.d/upstream.conf && echo canary || echo live
# ...and restore it after the reset with `bash deploy/cutover.sh --to <captured>`,
# otherwise the reset silently reverts live routing to whatever this file's
# committed default is, independent of any deliberate cutover decision.
#
# Uses a map (not an `upstream` block) so proxy_pass can reference $api_upstream
# as a variable, which forces nginx to re-resolve the container IP via the
# `resolver` directive at runtime instead of caching it once at startup.
map $host $api_upstream {
    default api:8000;
}
