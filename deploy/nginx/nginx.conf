user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    keepalive_timeout   65;
    client_max_body_size 20m;

    # Long timeouts for LLM streaming responses and SSE connections
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout  60s;

    # Docker embedded DNS — re-resolve upstream container IPs at runtime so a
    # recreated api/frontend container (new IP) does not strand nginx on a dead
    # cached address (502). valid=10s caps how long a resolved IP is cached.
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/conf.d/*.conf;
}
