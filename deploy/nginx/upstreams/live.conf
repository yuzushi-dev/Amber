# Live upstream — points to the primary API container.
# Activate with: bash deploy/cutover.sh --to live
#
# OPERATIONAL NOTE: deploy/nginx/conf.d/upstream.conf (copied from this file
# by cutover.sh) is git-tracked but mutated in place at runtime. Preserve the
# active target across any `git reset --hard` — see the note in that file.
#
# Uses a map (not an `upstream` block) so proxy_pass can reference $api_upstream
# as a variable, which forces nginx to re-resolve the container IP via the
# `resolver` directive at runtime instead of caching it once at startup.
map $host $api_upstream {
    default api:8000;
}
