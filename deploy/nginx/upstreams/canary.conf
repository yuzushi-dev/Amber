# Canary upstream — points to the canary API container.
# api-canary must be running and healthy before switching here.
# Activate with: bash deploy/cutover.sh --to canary
#
# OPERATIONAL NOTE: deploy/nginx/conf.d/upstream.conf (copied from this file
# by cutover.sh) is git-tracked but mutated in place at runtime. Preserve the
# active target across any `git reset --hard` — see the note in that file.
map $host $api_upstream {
    default api-canary:8000;
}
