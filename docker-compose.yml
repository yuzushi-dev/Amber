volumes:
  graphrag-redis:
  graphrag-postgres:
  graphrag-neo4j:
  graphrag-etcd:

  graphrag-minio-data:
  graphrag-garage-data:
  graphrag-garage-meta:
  graphrag-milvus:
  graphrag-uploads:
