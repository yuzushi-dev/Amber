version: '3.8'

# =============================================================================
# Amber System - Docker Compose Configuration
# =============================================================================
# Services:
#   - api:      FastAPI application server
#   - worker:   Celery task worker
#   - redis:    Cache and message broker
#   - postgres: Metadata storage
#   - neo4j:    Graph database
#   - milvus:   Vector database
#   - etcd:     Milvus metadata store
#   - etcd:     Milvus metadata store
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # ---------------------------------------------------------------------------
  # Frontend - React Application
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    # ports:            # Handled by deploy/nginx — see nginx service below.
    #   - "3000:3000"
    environment:
      - VITE_API_TARGET=http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped
    networks:
      - graphrag-network

  # ---------------------------------------------------------------------------
  # API Server - FastAPI application
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile

    # ports:            # Handled by deploy/nginx — see nginx service below.
    #   - "${API_PORT:-8000}:8000"
    environment:
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=8000
      - PYTHONPATH=/app:/app/src:/app/.packages
      - DEBUG=${DEBUG:-false}
      - SECRET_KEY=${SECRET_KEY}
      - SECRET_KEY_OLD=${SECRET_KEY_OLD:-}
      - DEV_API_KEY=${DEV_API_KEY}
      - APP_DATABASE_URL=${APP_DATABASE_URL:-}
      - TENANT_ID=${TENANT_ID:-default}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - IGNORE_EMBEDDING_MISMATCH=true
      - DATABASE_URL=postgresql+asyncpg://graphrag:graphrag@postgres:5432/graphrag
      - GRAPHRAG_APP_PASSWORD=${GRAPHRAG_APP_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_FALLBACK_ENABLED=${LLM_FALLBACK_ENABLED:-true}
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY:-}
      - NVIDIA_NIM_BASE_URL=${NVIDIA_NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-32768}
      - OLLAMA_CAPACITY_ENABLED=${OLLAMA_CAPACITY_ENABLED:-true}
      - OLLAMA_CAPACITY_TOTAL=${OLLAMA_CAPACITY_TOTAL:-6}
      - OLLAMA_CAPACITY_RESERVED_CHAT=${OLLAMA_CAPACITY_RESERVED_CHAT:-2}
      - OLLAMA_CAPACITY_RESERVED_INGESTION=${OLLAMA_CAPACITY_RESERVED_INGESTION:-2}
      - OLLAMA_CAPACITY_LEASE_TTL_SECONDS=${OLLAMA_CAPACITY_LEASE_TTL_SECONDS:-600}
      - OLLAMA_CAPACITY_CHAT_WAIT_TIMEOUT_SECONDS=${OLLAMA_CAPACITY_CHAT_WAIT_TIMEOUT_SECONDS:-15}
      - OLLAMA_CAPACITY_INGESTION_WAIT_TIMEOUT_SECONDS=${OLLAMA_CAPACITY_INGESTION_WAIT_TIMEOUT_SECONDS:-120}
      - OLLAMA_CAPACITY_COMMUNITIES_WAIT_TIMEOUT_SECONDS=${OLLAMA_CAPACITY_COMMUNITIES_WAIT_TIMEOUT_SECONDS:-600}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-}
      - DEFAULT_LLM_MODEL=${DEFAULT_LLM_MODEL:-}
      - OLLAMA_CLOUD_BASE_URL=${OLLAMA_CLOUD_BASE_URL:-https://ollama.com/v1}
      - OLLAMA_CLOUD_API_KEYS=${OLLAMA_CLOUD_API_KEYS:-}
      - DEFAULT_EMBEDDING_PROVIDER=${DEFAULT_EMBEDDING_PROVIDER:-ollama}
      - DEFAULT_EMBEDDING_MODEL=${DEFAULT_EMBEDDING_MODEL:-nomic-embed-text}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-768}
      - OBJECT_STORAGE_HOST=${OBJECT_STORAGE_HOST:-garage}
      - OBJECT_STORAGE_PORT=${OBJECT_STORAGE_PORT:-3900}
      - OBJECT_STORAGE_ACCESS_KEY=${OBJECT_STORAGE_ACCESS_KEY}
      - OBJECT_STORAGE_SECRET_KEY=${OBJECT_STORAGE_SECRET_KEY}
      - OBJECT_STORAGE_SECURE=${OBJECT_STORAGE_SECURE:-false}
      - OBJECT_STORAGE_BUCKET_NAME=${OBJECT_STORAGE_BUCKET_NAME:-documents}

      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - AMBER_RUNTIME=docker
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./scripts:/app/scripts:ro
      - ./pytest.ini:/app/pytest.ini:ro
      - ./config:/app/config:ro
      - ./alembic:/app/alembic:ro
      - graphrag-uploads:/app/uploads
      - pip-packages:/app/.packages
      - ./.cache/huggingface:/home/appuser/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      milvus:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    logging: *default-logging
    # Memory ceiling. 48h weekday profiling (cgroup memory.current, 572 samples)
    # showed api-1's working set is HIGH but bounded — it sits ~4.4G (peak 4423M)
    # and does NOT grow monotonically within a container life (no fast leak); the
    # host-OOM is driven by that high working set colliding with an undersized
    # host during the nightly ingestion burst. So this limit is a runaway/leak
    # BACKSTOP set ABOVE the observed working set (6G > 4.4G) — low enough to
    # cgroup-kill a genuine runaway, high enough not to crashloop normal ops.
    # Sized from 48h cgroup profiling: working set plateaus at ~4.4G (peak
    # 4423MB) under weekday load; the one-off ~5.3G spike was a banned
    # docker-exec of ML scripts, not normal load. 5.5G limit = plateau + ~1G
    # headroom for concurrent SPLADE/rerank (both run inline in api). The 4.5G
    # reservation keeps api's working set guaranteed so it isn't the one
    # squeezed under host pressure (it was the recurring OOM victim).
    deploy:
      resources:
        limits:
          memory: 5500M
        reservations:
          memory: 4500M
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - graphrag-network

  # ---------------------------------------------------------------------------
  # Celery Worker - Background task processing
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile

    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=${SECRET_KEY}
      - SECRET_KEY_OLD=${SECRET_KEY_OLD:-}
      - APP_DATABASE_URL=${APP_DATABASE_URL:-}
      - TENANT_ID=${TENANT_ID:-default}
      - HTML_MARKDOWN_ENABLED=${HTML_MARKDOWN_ENABLED:-false}
      - CONTEXTUAL_ENRICHMENT_ENABLED=${CONTEXTUAL_ENRICHMENT_ENABLED:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - PYTHONPATH=/app:/app/src:/app/.packages
      - DATABASE_URL=postgresql+asyncpg://graphrag:graphrag@postgres:5432/graphrag
      - GRAPHRAG_APP_PASSWORD=${GRAPHRAG_APP_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_FALLBACK_ENABLED=${LLM_FALLBACK_ENABLED:-true}
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY:-}
      - NVIDIA_NIM_BASE_URL=${NVIDIA_NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-32768}
      - OLLAMA_CAPACITY_ENABLED=${OLLAMA_CAPACITY_ENABLED:-true}
      - OLLAMA_CAPACITY_TOTAL=${OLLAMA_CAPACITY_TOTAL:-6}
      - OLLAMA_CAPACITY_RESERVED_CHAT=${OLLAMA_CAPACITY_RESERVED_CHAT:-2}
      - OLLAMA_CAPACITY_RESERVED_INGESTION=${OLLAMA_CAPACITY_RESERVED_INGESTION:-2}
      - OLLAMA_CAPACITY_LEASE_TTL_SECONDS=${OLLAMA_CAPACITY_LEASE_TTL_SECONDS:-600}
      - OLLAMA_CAPACITY_CHAT_WAIT_TIMEOUT_SECONDS=${OLLAMA_CAPACITY_CHAT_WAIT_TIMEOUT_SECONDS:-15}
      - OLLAMA_CAPACITY_INGESTION_WAIT_TIMEOUT_SECONDS=${OLLAMA_CAPACITY_INGESTION_WAIT_TIMEOUT_SECONDS:-120}
      - OLLAMA_CAPACITY_COMMUNITIES_WAIT_TIMEOUT_SECONDS=${OLLAMA_CAPACITY_COMMUNITIES_WAIT_TIMEOUT_SECONDS:-600}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-}
      - DEFAULT_LLM_MODEL=${DEFAULT_LLM_MODEL:-}
      - OLLAMA_CLOUD_BASE_URL=${OLLAMA_CLOUD_BASE_URL:-https://ollama.com/v1}
      - OLLAMA_CLOUD_API_KEYS=${OLLAMA_CLOUD_API_KEYS:-}
      - DEFAULT_EMBEDDING_PROVIDER=${DEFAULT_EMBEDDING_PROVIDER:-ollama}
      - DEFAULT_EMBEDDING_MODEL=${DEFAULT_EMBEDDING_MODEL:-nomic-embed-text}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-768}
      - OBJECT_STORAGE_HOST=${OBJECT_STORAGE_HOST:-garage}
      - OBJECT_STORAGE_PORT=${OBJECT_STORAGE_PORT:-3900}
      - OBJECT_STORAGE_ACCESS_KEY=${OBJECT_STORAGE_ACCESS_KEY}
      - OBJECT_STORAGE_SECRET_KEY=${OBJECT_STORAGE_SECRET_KEY}
      - OBJECT_STORAGE_SECURE=${OBJECT_STORAGE_SECURE:-false}
      - OBJECT_STORAGE_BUCKET_NAME=${OBJECT_STORAGE_BUCKET_NAME:-documents}
      - COMMUNITY_SUMMARIZATION_CONCURRENCY=${COMMUNITY_SUMMARIZATION_CONCURRENCY:-1}

      - AMBER_RUNTIME=docker
      - HF_HOME=/home/appuser/.cache/huggingface
    command: celery -A src.workers.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2} -Q high_priority,celery,evaluation,low_priority
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./alembic:/app/alembic:ro
      - graphrag-uploads:/app/uploads
      - pip-packages:/app/.packages
      - ./.cache/huggingface:/home/appuser/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      milvus:
        condition: service_started
    logging: *default-logging
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Per-replica ceiling. 3 replicas observed ~1.67G each at CELERY_CONCURRENCY=2.
    # 2G limit = observed + margin; 1.5G reservation. 3×2G caps the worker tier
    # at 6G while worker_max_memory_per_child (celery_app.py) recycles a process
    # before it approaches the cap, so an ingestion fan-out spike can't grow
    # unbounded into a host-OOM. If throughput needs more, add host RAM or
    # replicas — do not raise this without re-checking the host budget.
    #
    # replicas is declared explicitly: the sizing above assumes 3, and leaving it
    # to an out-of-band `--scale worker=N` made the budget unverifiable from the
    # file alone.
    #
    # These limits are per-container BACKSTOPS, not an allocation budget: the sum
    # of the caps that are actually applied (api 5500M + worker 3×2G + minio 1G =
    # ~12.4G) sits under the 15G host, and the two datastores are deliberately
    # left uncapped (see the neo4j and milvus blocks for why). Observed steady
    # state is ~11.5G. What must stay under the host is the sum of real working
    # sets, not of the caps.
    #
    # This 2G is the tightest cap in the file and the one to watch first. The
    # cgroup memory.peak for these replicas over four weeks is 4.21 / 4.48 / 5.40
    # GiB — but that was measured WITHOUT worker_max_memory_per_child, which this
    # release introduces, so the peaks are not a prediction of post-deploy
    # behaviour. The residual risk is that recycling happens BETWEEN tasks: Leiden
    # runs in-process here (igraph + leidenalg in graph/application/communities),
    # and _fetch_l0_graph pulls the whole entity graph into the child, so one task
    # can cross 800 MiB before the recycler can act. If a worker takes a container
    # OOM-kill during community recompute, raise this to 3G — do not "fix" it by
    # lowering concurrency, which only makes each task hold its peak for longer.
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1536M
    restart: unless-stopped
    # Celery runs with task_acks_late=True, so a task killed mid-flight is
    # redelivered and re-runs its destructive pre-ingest cleanup. Compose's
    # default 10s stop timeout is shorter than any ingestion task, which turns
    # every planned `stop` into that scenario. 300s lets the warm shutdown drain.
    stop_grace_period: 300s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - graphrag-network

  # ---------------------------------------------------------------------------
  # Celery Beat - Scheduler for periodic tasks (backup heartbeat, etc.)
  # ---------------------------------------------------------------------------
  celery_beat:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=${SECRET_KEY}
      - SECRET_KEY_OLD=${SECRET_KEY_OLD:-}
      - APP_DATABASE_URL=${APP_DATABASE_URL:-}
      - TENANT_ID=${TENANT_ID:-default}
      - HTML_MARKDOWN_ENABLED=${HTML_MARKDOWN_ENABLED:-false}
      - CONTEXTUAL_ENRICHMENT_ENABLED=${CONTEXTUAL_ENRICHMENT_ENABLED:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - PYTHONPATH=/app:/app/src:/app/.packages
      - DATABASE_URL=postgresql+asyncpg://graphrag:graphrag@postgres:5432/graphrag
      - GRAPHRAG_APP_PASSWORD=${GRAPHRAG_APP_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
      - AMBER_RUNTIME=docker
    command: celery -A src.workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./alembic:/app/alembic:ro
      - pip-packages:/app/.packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped
    networks:
      - graphrag-network

  # ---------------------------------------------------------------------------
  # Redis - Cache and Message Broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"
    volumes:
      - graphrag-redis:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: unless-stopped
    networks:
      - graphrag-network

  # ---------------------------------------------------------------------------
  # PostgreSQL - Metadata Storage
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine

    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-graphrag}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-graphrag}
    volumes:
      - graphrag-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-graphrag} -d ${POSTGRES_DB:-graphrag}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: unless-stopped
    networks:
      - graphrag-network

  # ---------------------------------------------------------------------------
  # Neo4j - Graph Database
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5-community

    hostname: graphrag-neo4j
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - graphrag-neo4j:/data
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging
    restart: unless-stopped
    # DELIBERATELY UNCAPPED. An earlier revision set limits.memory=2560M on the
    # reasoning that heap is bounded to 1G above and only the off-heap page cache
    # and native buffers were unbounded (~2G observed RSS). The instantaneous RSS
    # was the wrong measure: cgroup memory.peak over four weeks of uptime is
    # 2.997.268.480 (2.79 GiB), i.e. the 2560M cap had already been exceeded
    # before it was ever applied. Raising it does not fix the shape of the risk:
    #   - 97% of that memory is anon (memory.stat: anon 2.34G, inactive_file 18M),
    #     so the kernel cannot reclaim under cgroup pressure - it can only OOM.
    #   - host swap was fully consumed, leaving no absorber (a 4G swapfile has
    #     since been added, but it parks cold pages; it does not raise the ceiling).
    #   - ~570 MiB of that peak is not Neo4j: scripts/backup.sh runs cypher-shell
    #     via `docker exec`, which lands a SECOND JVM in this cgroup, twice a
    #     night, with no -Xmx so it self-sizes to a quarter of visible RAM.
    # What a cap buys here is a container-local kill boundary below the observed
    # peak, on a datastore. Every OOM this host has taken (11 in kern.log, all
    # global_oom) picked the api container, which is stateless and restarts clean.
    # A Neo4j kill between the DETACH DELETE and the rebuild in the ingestion
    # pipeline leaves the graph amputated while Postgres still reports READY: the
    # store recovers from the WAL, the content does not.
    # Before capping this service: bound cypher-shell (JAVA_OPTS=-Xmx256m in
    # backup.sh), bound the off-heap explicitly (-XX:MaxDirectMemorySize), then
    # size the cap from a deducible budget rather than from a measurement.
    networks:
      - graphrag-network

  # ---------------------------------------------------------------------------
  # etcd - Milvus Metadata Store
  # ---------------------------------------------------------------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.5

    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - graphrag-etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 30s
      timeout: 20s
      retries: 3
    logging: *default-logging
    restart: unless-stopped
    networks:
      - graphrag-network



  # ---------------------------------------------------------------------------
  # MinIO - S3-Compatible Object Storage (replaces Garage)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${OBJECT_STORAGE_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${OBJECT_STORAGE_SECRET_KEY}
    volumes:
      - graphrag-minio-data:/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    networks:
      - graphrag-network

  # ---------------------------------------------------------------------------
  # Garage (S3-Compatible Object Storage) — DISABLED: replaced by MinIO
  # ---------------------------------------------------------------------------
  # garage:
  #   image: dxflrs/garage:v1.1.0
  #   volumes:
  #     - ./docker/garage/garage.toml:/etc/garage.toml:ro
  #     - graphrag-garage-data:/var/lib/garage/data
  #     - graphrag-garage-meta:/var/lib/garage/meta
  #   ports:
  #     - "3900:3900"  # S3 API
  #     - "3903:3903"  # Admin API
  #   healthcheck:
  #     test: [ "CMD", "/garage", "stats", "-a" ]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 15s
  #   logging: *default-logging
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 1G
  #       reservations:
  #         memory: 256M
  #   ulimits:
  #     nofile:
  #       soft: 65536
  #       hard: 65536
  #   restart: unless-stopped
  #   networks:
  #     - graphrag-network

  # ---------------------------------------------------------------------------
  # Milvus - Vector Database
  # ---------------------------------------------------------------------------
  milvus:
    image: milvusdb/milvus:v2.5.4

    command: [ "milvus", "run", "standalone" ]
    security_opt:
      - seccomp:unconfined
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=${MILVUS_MINIO_ADDRESS:-minio:9000}
      - MINIO_ACCESS_KEY_ID=${OBJECT_STORAGE_ACCESS_KEY}
      - MINIO_SECRET_ACCESS_KEY=${OBJECT_STORAGE_SECRET_KEY}
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - graphrag-milvus:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s
    logging: *default-logging
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    # DELIBERATELY UNCAPPED. An earlier revision set limits.memory=1536M as a
    # backstop against the segment/index cache growing with the vector set. The
    # measured cgroup memory.peak is 2.636.034.048 (2.455 GiB) - 1.64x the cap,
    # already reached before the cap existed. An OOM-kill of Milvus during a
    # flush is the one failure this deployment cannot repair: it leaves segments
    # inconsistent with the etcd metadata, and etcd is snapshotted separately
    # from the Milvus volume, so the backup pair stops being coherent.
    # See the Neo4j block above for the full reasoning on why capping a datastore
    # below its observed peak trades a stateless victim for a stateful one.
    networks:
      - graphrag-network

  # ---------------------------------------------------------------------------
  # Nginx — Edge Proxy and Cutover Switch
  # ---------------------------------------------------------------------------
  # Nginx takes over host ports :8000 (API) and :3000 (frontend) so that
  # traffic can be switched atomically between live and canary deployments.
  #
  # Activate nginx (one-time, ~15s interruption to reassign host ports):
  #   docker compose up -d nginx api frontend
  #
  # Verify after activation:
  #   bash scripts/smoke_production_readonly.sh
  #
  # Switch traffic to canary:
  #   bash deploy/cutover.sh --to canary
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: amber2-nginx-1
    ports:
      - "8000:80"    # API traffic (was: direct from api service)
      - "80:3000"  # Frontend traffic (was: direct from frontend service)
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d  # NOT :ro — cutover.sh writes upstream.conf
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging
    restart: unless-stopped
    networks:
      - graphrag-network


