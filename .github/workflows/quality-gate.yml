name: quality-gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # Throwaway graph for tests/graph_cypher (real Cypher semantics, not mocks).
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
          - 7688:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          # Same pinned runtime set as docker/api.Dockerfile, so CI type-checks and
          # tests against the versions production runs; dev extras fill in the rest.
          ./.venv/bin/pip install -r requirements-core.txt
          ./.venv/bin/pip install -e ".[dev]"

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run quality gate
        run: bash scripts/verify.sh all

      - name: Run graph Cypher tests
        env:
          AMBER_TEST_NEO4J_URI: bolt://localhost:7688
          AMBER_TEST_NEO4J_PASSWORD: testpassword
        run: ./.venv/bin/pytest -q tests/graph_cypher
