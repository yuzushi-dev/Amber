# MinIO service replacement for Garage
# Usage: docker compose -f docker-compose.yml -f docker/minio/docker-compose.minio.yml up -d minio
# This file extends the base docker-compose.yml — do NOT duplicate other services.

  minio:
    image: minio/minio:RELEASE.2024-10-02T19-33-24Z
    container_name: amber2-minio-1
    command: server /data --console-address ":9001"
    volumes:
      - graphrag-minio-data:/data
    ports:
      - "3900:9000"   # S3 API (same port as Garage)
      - "3901:9001"   # Console (internal only)
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY}
      MINIO_SCAN: "deep"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped
    networks:
      - graphrag-network

  minio-init:
    image: minio/mc:RELEASE.2024-10-02T19-33-24Z
    container_name: amber2-minio-init-1
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${OBJECT_STORAGE_ACCESS_KEY} $${OBJECT_STORAGE_SECRET_KEY};
      mc mb --ignore-existing local/documents;
      mc mb --ignore-existing local/a-bucket;
      mc ilm rule add --abort-incomplete-multipart-upload-days 3 local/a-bucket 2>/dev/null || true;
      exit 0"
    logging: *default-logging
    networks:
      - graphrag-network
    restart: "no"

volumes:
  graphrag-minio-data:
    driver: local
